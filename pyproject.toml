[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiferet-agents"
dynamic = ["version"]
description = "Agentic extension for the Tiferet framework with LangGraph-based agent orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
    "tiferet>=2.0.0b3",
    "langgraph>=1.0",
    "langchain-openai",
    "langchain-core",
]

[project.urls]
Homepage = "https://github.com/greatstrength/tiferet-agents"
Repository = "https://github.com/greatstrength/tiferet-agents"
Issues = "https://github.com/greatstrength/tiferet-agents/issues"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]
anthropic = [
    "langchain-anthropic",
]
google = [
    "langchain-google-genai",
]
memory = [
    "tiferet-kb>=0.2.0a1",
]
sqlite = [
    "langgraph-checkpoint-sqlite",
]
postgres = [
    "langgraph-checkpoint-postgres",
]
all = [
    "langchain-anthropic",
    "langchain-google-genai",
    "tiferet-kb>=0.2.0a1",
    "langgraph-checkpoint-sqlite",
]

[tool.setuptools.dynamic]
version = {attr = "tiferet_agents.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["tiferet_agents*"]

[tool.pytest.ini_options]
testpaths = ["tiferet_agents"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
