errors:
  AGENT_NOT_FOUND:
    name: Agent Not Found
    message:
      - lang: en_US
        text: 'Agent configuration not found: {agent_id}'
  AGENT_ALREADY_EXISTS:
    name: Agent Already Exists
    message:
      - lang: en_US
        text: 'Agent configuration already exists: {id}'
  INVALID_PROVIDER:
    name: Invalid LLM Provider
    message:
      - lang: en_US
        text: 'Unsupported LLM provider: {provider}'
  CONVERSATION_NOT_FOUND:
    name: Conversation Not Found
    message:
      - lang: en_US
        text: 'Conversation not found: {conversation_id}'
  GRAPH_BUILD_ERROR:
    name: Graph Build Error
    message:
      - lang: en_US
        text: 'Failed to build agent graph for agent {agent_id}: {error}'
  LLM_INVOCATION_ERROR:
    name: LLM Invocation Error
    message:
      - lang: en_US
        text: 'LLM invocation failed: {error}'
  TOOL_NOT_FOUND:
    name: Tool Not Found
    message:
      - lang: en_US
        text: 'Tool {tool_id} not found on agent {agent_id}'
  TOOL_LOAD_ERROR:
    name: Tool Load Error
    message:
      - lang: en_US
        text: 'Failed to load tool {tool_id}: {error}'
  INVALID_GRAPH_TYPE:
    name: Invalid Graph Type
    message:
      - lang: en_US
        text: 'Unsupported graph type: {graph_type} for agent {agent_id}'
  EMBEDDING_ERROR:
    name: Embedding Error
    message:
      - lang: en_US
        text: 'Embedding generation failed: {error}'
  MEMORY_NAMESPACE_NOT_FOUND:
    name: Memory Namespace Not Found
    message:
      - lang: en_US
        text: 'Memory namespace not found: {namespace_id}'
  MEMORY_FACT_NOT_FOUND:
    name: Memory Fact Not Found
    message:
      - lang: en_US
        text: 'Memory fact not found: {fact_id}'
